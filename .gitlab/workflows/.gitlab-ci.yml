spec:
  inputs:
    action:
      type: string
      description: "Action Container App"
      default: none
      options: ["none", "create", "delete"]
---
include:
  - local: ".gitlab/workflows/.gitlab-cd.yml"
  - local: ".gitlab/workflows/.gitlab-ressource-handler.yml"
    inputs:
      action: $[[ inputs.action ]]

stages:
  - lint
  - sast
  - deploy
  - build
  - manage

flake8:
  stage: lint
  image: python:3.14
  script:
    - pip install flake8
    - flake8 app.py

bandit:
  stage: sast
  image: python:3.14
  script:
    - pip install bandit
    - bandit -r app.py -ll
