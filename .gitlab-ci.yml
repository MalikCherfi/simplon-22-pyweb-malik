stages:
  - lint
  - build

lint:
  stage: lint
  image: python:3.14
  script:
    - pip install flake8
    - flake8 app.py
    - pip install bandit
    - bandit -r app.py -ll

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
